# Prometheus configuration for LocalAgency Kits
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
    metrics_path: '/health'

  - job_name: 'dashboard'
    static_configs:
      - targets: ['dashboard:8080']

  - job_name: 'voicekit-worker'
    static_configs:
      - targets: ['voicekit-worker:8000']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']
